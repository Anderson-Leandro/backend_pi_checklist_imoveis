name: Deploy to EC2

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copia chave SSH para o runner
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Adiciona host da EC2 à lista known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Conecta na EC2 e faz deploy
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            REPO_DIR="/home/ubuntu/backend_pi_checklist_imoveis"
            REPO_URL="https://Anderson-Leandro:${{ secrets.GH_FG_TOKEN }}@github.com/Anderson-Leandro/backend_pi_checklist_imoveis.git"

            git config --global user.email "andersonmendesleandro@gmail.com"
            git config --global user.name "Anderson Leandro"

            if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf $REPO_DIR
              git clone $REPO_URL $REPO_DIR
            else
              cd $REPO_DIR
              git remote set-url origin $REPO_URL
              git pull origin main
            fi

            cd $REPO_DIR

            # Cria .env se não existir
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            sudo docker compose down || true
            sudo docker compose up -d --build
          EOF