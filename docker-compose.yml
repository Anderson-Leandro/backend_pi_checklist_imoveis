services:

  # ─── Aplicação PHP ─────────────────────────────────────────────────────────
  app:
    build:
        context: .
        dockerfile: docker/php/Dockerfile
    container_name: php_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - php_network
    depends_on:
      db:
        condition: service_healthy

  # ─── Servidor Web (Nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: php_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - php_network
    depends_on:
      - app

  # ─── Banco de Dados (MySQL) ────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: php_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-appdb}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - php_network

  # ─── MinIO (S3-compatible para desenvolvimento e testes) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: php_minio
    restart: unless-stopped
    ports:
      - "9010:9000"   # API S3 — endpoint usado pelo SDK
      - "9011:9001"   # Console web — acesse http://localhost:9011
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - php_network

  # ─── Inicialização do bucket MinIO ─────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: php_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb local/$${AWS_BUCKET:-onecheck-dev} --ignore-existing &&
        echo '[✓] Bucket $${AWS_BUCKET:-onecheck-dev} pronto.'
      "
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_BUCKET: ${AWS_BUCKET:-onecheck-dev}
    networks:
      - php_network

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local

networks:
  php_network:
    driver: bridge
