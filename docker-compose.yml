services:

  # ─── Aplicação PHP ─────────────────────────────────────────────────────────
  app:
    build:
        context: .
        dockerfile: docker/php/Dockerfile
    container_name: php_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html                      # bind mount — alterações locais refletem sem rebuild
      - php_vendor:/var/www/html/vendor      # vendor isolado do build (não sobrescrito pelo bind)
      - ./.env:/var/www/html/.env:ro
    networks:
      - php_network
    depends_on:
      db:
        condition: service_healthy

  # ─── Servidor Web (Nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: php_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - php_network
    depends_on:
      - app

  # ─── Banco de Dados (MySQL) ────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: php_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-appdb}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - php_network

volumes:
  mysql_data:
    driver: local
  php_vendor:
    driver: local

networks:
  php_network:
    driver: bridge
